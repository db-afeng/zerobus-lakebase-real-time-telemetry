services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datacart
      POSTGRES_USER: datacart
      POSTGRES_PASSWORD: datacart
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacart -d datacart"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi-proxy.cloud.databricks.com/simple}
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec python -m uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: datacart
      PGPASSWORD: datacart
      PGDATABASE: datacart
      PGSSLMODE: disable
      DB_SCHEMA: ecommerce
      ZEROBUS_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 3s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://npm-proxy.cloud.databricks.com/}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
