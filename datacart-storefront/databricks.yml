bundle:
  name: datacart-storefront-data-centric
  engine: direct

# The Lakebase project is provisioned outside this bundle so its OAuth group
# role can exist before the app service principal is created. These variables
# bind the app to that existing project's production resources.
variables:
  project_id:
    description: Existing Lakebase project slug.
    default: zerobus-lakebase-workshop-alex-feng
  endpoint_name:
    description: Full resource path of the project's production read-write endpoint.
    default: projects/${var.project_id}/branches/production/endpoints/primary
  # --- Zerobus clickstream producer (Lab 3.1) -------------------------------
  # Off by default. Lab 3.1 flips zerobus_enabled=true and sets the endpoint +
  # bronze table (e.g. via `databricks bundle deploy --var=...` or a target
  # override) once the bronze table from Lab 1.1 exists.
  zerobus_enabled:
    description: Enable the storefront's Zerobus clickstream producer.
    default: "false"
  zerobus_endpoint:
    description: Region-specific Zerobus server endpoint (https://<workspace-id>.zerobus.<region>.cloud.databricks.com).
    # Non-empty sentinel: the Apps API rejects empty env `value: ""`. The producer
    # ignores this entirely while zerobus_enabled is "false".
    default: "unset"
  zerobus_bronze_table:
    description: Fully-qualified UC bronze target (<catalog>.ecommerce.clickstream_bronze).
    default: "unset"

include:
  - resources/*.yml

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      host: https://fevm-infomedia-lakebase.cloud.databricks.com
